name: logsense
x-backend: &backend
  build: ./backend
  environment: &environment
    MONGO_URI: mongodb://mongodb:27017
    POSTGRES_URI: postgresql://logsense:${POSTGRES_PASSWORD:-logsense-local}@postgres:5432/logsense
    REDIS_URI: redis://redis:6379/0
    LOGSENSE_API_KEY: ${LOGSENSE_API_KEY:-}
    MODEL_PATH: ${MODEL_PATH:-}
    EVALUATIONS_DIR: /evaluations
    OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
    OLLAMA_MODEL: ${OLLAMA_MODEL:-}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    OPENAI_MODEL: ${OPENAI_MODEL:-}
  volumes:
    - ./models:/models:ro
    - ./experiments/runs:/evaluations:ro
    - ./experiments/storage-runs:/benchmarks:ro
  extra_hosts:
    - host.docker.internal:host-gateway
  restart: unless-stopped
services:
  mongodb:
    image: mongo:8.0
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: logsense
      POSTGRES_USER: logsense
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logsense-local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U logsense"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, "yes", --appendfsync, everysec]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    <<: *backend
    ports:
      - "127.0.0.1:${API_PORT:-8010}:8000"
    depends_on:
      mongodb: {condition: service_healthy}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import os,urllib.request; urllib.request.urlopen(urllib.request.Request('http://localhost:8000/api/health',headers={'X-API-Key':os.getenv('LOGSENSE_API_KEY','')}),timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 20
  classifier:
    <<: *backend
    command: [python, -m, app.worker]
    environment:
      <<: *environment
      WORKER_GROUP: classification
    depends_on:
      api: {condition: service_healthy}
  knowledge-worker:
    <<: *backend
    command: [python, -m, app.worker]
    environment:
      <<: *environment
      WORKER_GROUP: knowledge
    depends_on:
      api: {condition: service_healthy}
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-3010}:80"
    depends_on:
      api: {condition: service_healthy}
volumes:
  mongo-data:
  postgres-data:
  redis-data:
